<div class="input-card">
  <!-- Input Mode Switcher -->
  <div class="mode-tabs">
    <button [class.active]="inputMode === 'grid'" (click)="inputMode = 'grid'">
      <span class="icon">▦</span> Matrix Grid Input
    </button>
    <button [class.active]="inputMode === 'text'" (click)="inputMode = 'text'">
      <span class="icon">✍️</span> Text Equations Input
    </button>
  </div>

  <!-- GRID MODE INPUT -->
  <div *ngIf="inputMode === 'grid'" class="grid-mode-container">
    <div class="dimension-bar">
      <!-- Equations Control (Rows) -->
      <div class="custom-stepper-group">
        <label>
          <span class="lbl-primary">Equations:</span>
          <span class="lbl-sub">Number of equations</span>
        </label>
        <div class="stepper" lang="en" dir="ltr">
          <button type="button" class="btn-step" (click)="adjustEquations(-1)">-</button>
          <button type="button" class="stepper-val-btn" readonly tabindex="-1" lang="en" dir="ltr">
            {{ numEquations }}
          </button>
          <button type="button" class="btn-step" (click)="adjustEquations(1)">+</button>
        </div>
      </div>

      <!-- Variables Control (Columns) -->
      <div class="custom-stepper-group">
        <label>
          <span class="lbl-primary">Variables:</span>
          <span class="lbl-sub">Number of variables</span>
        </label>
        <div class="stepper" lang="en" dir="ltr">
          <button type="button" class="btn-step" (click)="adjustVariables(-1)">-</button>
          <button type="button" class="stepper-val-btn" readonly tabindex="-1" lang="en" dir="ltr">
            {{ numVariables }}
          </button>
          <button type="button" class="btn-step" (click)="adjustVariables(1)">+</button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="quick-btns">
        <button type="button" class="btn-sub" (click)="loadSample()">Sample System</button>
        <button type="button" class="btn-sub" (click)="randomize()">Random</button>
      </div>
    </div>

    <form [formGroup]="matrixForm" class="matrix-grid-form">
      <div class="grid-wrapper">
        <!-- Variable Column Headers -->
        <div class="grid-headers" lang="en" dir="ltr">
          <div 
            *ngFor="let varName of variableNames" 
            class="header-cell var-cell"
          >
            {{ varName }}
          </div>
          <div class="header-cell const-cell">b (Constant)</div>
        </div>

        <!-- Matrix Bracket Cells -->
        <div formArrayName="grid" class="matrix-brackets">
          <div *ngFor="let row of grid.controls; let i = index" [formArrayName]="i" class="matrix-row">
            <div 
              *ngFor="let cell of getRowArray(i).controls; let j = index" 
              class="cell-unit" 
              [class.constant-col]="j === totalCols - 1"
            >
              <input 
                type="text" 
                [formControlName]="j"
                (input)="onCellInput($event, i, j)"
                lang="en"
                dir="ltr"
              >
              <div class="input-spinners">
                <button type="button" (click)="adjustCellValue(i, j, 1)">▲</button>
                <button type="button" (click)="adjustCellValue(i, j, -1)">▼</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div *ngIf="inputMode === 'text'" class="text-mode-container">
    <label class="text-label">Enter System Equations (One equation per line):</label>
    <textarea [(ngModel)]="textEquations" rows="5" placeholder="e.g. 2x + y - z = 8&#10;-3x - y + 2z = -11" lang="en" dir="ltr"></textarea>
    <p class="hint-text">Supported variables: x, y, z or x1, x2, x3. Coefficients parsed automatically.</p>
  </div>

  <!-- ACTION SOLVE BUTTONS -->
  <div class="action-bar">
    <button type="button" class="btn-solve ref" (click)="submit(false)">
      Solve Gaussian (REF)
    </button>
    <button type="button" class="btn-solve rref" (click)="submit(true)">
      Solve Gauss-Jordan (RREF)
    </button>
  </div>
</div>
