name: Deploy to GitHub Pages
​on:
push:
branches: [ main ]
​permissions:
contents: read
pages: write
id-token: write
​concurrency:
group: 'pages'
cancel-in-progress: true
​jobs:
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20
cache: 'npm'
​- name: Install Dependencies
run: npm ci --legacy-peer-deps || npm install
​- name: Build Nx Angular Project
run: npx nx build Linear-Guess
​- name: Prepare Deployment Artifacts
run: |
mkdir -p deploy_dist
if [ -d "dist/Linear-Guess/browser" ]; then
cp -r dist/Linear-Guess/browser/* deploy_dist/
else
cp -r dist/Linear-Guess/* deploy_dist/
fi
cp deploy_dist/index.html deploy_dist/404.html
​- name: Upload Pages Artifact
uses: actions/upload-pages-artifact@v3
with:
path: 'deploy_dist'
​- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4